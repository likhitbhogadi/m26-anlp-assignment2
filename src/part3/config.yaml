# Q3: decoding strategies on Pythia-160M / ROCStories
model: EleutherAI/pythia-160m
dtype: float32            # 160M params; fp32 keeps batched/unbatched results bit-comparable

dataset: hamishivi/ROCStories
split: validation
n_samples: 1000
data_seed: 0              # which 1000 stories are drawn (same for every experiment)

max_new_tokens: 80        # covers the 4-sentence references; sanity.py prints their length percentiles
batch_size: 64            # prompts per batch for greedy / top-k / top-p
beam_batch_size: 16       # prompts per batch for beam search (rows on GPU = 16 * width)
length_penalty: 1.0       # beam hypothesis score = sum(log p) / length ** length_penalty
sample_seed: 0            # RNG seed for top-k / top-p sampling

output_dir: src/part3/outputs

wandb:
  project: anlp-a2-q3
  entity: null            # null -> default entity of the logged-in account
  group: part3-decoding

experiments:
  - {name: greedy,        strategy: greedy}

  - {name: beam_w1,       strategy: beam,  num_beams: 1}
  - {name: beam_w2,       strategy: beam,  num_beams: 2}
  - {name: beam_w4,       strategy: beam,  num_beams: 4}

  - {name: top_k5_T1.0,   strategy: top_k, k: 5,  temperature: 1.0}
  - {name: top_k20_T1.0,  strategy: top_k, k: 20, temperature: 1.0}
  - {name: top_k50_T1.0,  strategy: top_k, k: 50, temperature: 1.0}
  - {name: top_k50_T0.7,  strategy: top_k, k: 50, temperature: 0.7}

  - {name: top_p0.5_T1.0,  strategy: top_p, p: 0.5,  temperature: 1.0}
  - {name: top_p0.9_T1.0,  strategy: top_p, p: 0.9,  temperature: 1.0}
  - {name: top_p0.95_T1.0, strategy: top_p, p: 0.95, temperature: 1.0}
  - {name: top_p0.9_T0.7,  strategy: top_p, p: 0.9,  temperature: 0.7}

  # Optional seed-variance runs (enable if budget allows):
  # - {name: top_p0.9_T1.0_seed1, strategy: top_p, p: 0.9, temperature: 1.0, seed: 1}
  # - {name: top_p0.9_T1.0_seed2, strategy: top_p, p: 0.9, temperature: 1.0, seed: 2}
